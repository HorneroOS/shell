name: VM harness

# Manual-only checks for the graphical VM harness (tests/vm). This workflow
# never boots a VM: runners lack KVM and a compositor job would flake, so it
# covers exactly what is deterministic without hardware (lint, unit tests,
# and the end-to-end dry-run probe). Real KVM runs stay host-side per
# docs/VM_TESTING.md.

"on":
  workflow_dispatch:

jobs:
  harness-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: shellcheck harness scripts
        run: |
          shellcheck tests/vm/lib/*.sh tests/vm/scenarios/*.sh
          shellcheck -x tests/vm/lib/env.sh tests/vm/lib/*.sh tests/vm/scenarios/*.sh
      - name: Markdown lint for the harness runbook
        run: npx --yes markdownlint-cli2 "docs/VM_TESTING.md"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harness helper tests
        run: |
          pip install pytest
          python3 -m pytest tests/vm/ -q

  smoke-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harness coherence probe (no hypervisor)
        run: ./tests/vm/scenarios/vm-smoke.sh --dry-run
