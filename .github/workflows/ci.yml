name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Qt6 + native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libqalculate-dev libpipewire-0.3-dev libaubio-dev libfftw3-dev \
            ffmpeg
      - name: Build + install libcava from source
        # No libcava package exists in Ubuntu archives; build the shared
        # library from the same fork Nix/AUR packages (pinned tag for
        # reproducibility) and expose it via a libcava.pc file so the
        # plugin's pkg-config lookup keeps working unchanged.
        run: |
          git clone --depth 1 --branch 1.0.0 \
            https://github.com/LukashonakV/cava /tmp/cava
          cc -shared -fPIC -O2 -I/tmp/cava -I/tmp/cava/include \
            -o /tmp/cava/libcava.so /tmp/cava/cavacore.c -lm -lfftw3
          sudo install -Dm755 /tmp/cava/libcava.so /usr/local/lib/libcava.so
          sudo install -Dm644 /tmp/cava/include/cava/cavacore.h \
            /tmp/cava/include/cava/common.h /tmp/cava/include/cava/config.h \
            -t /usr/local/include/cava/
          sudo install -Dm644 /tmp/cava/include/cava/input/common.h \
            -t /usr/local/include/cava/input/
          sudo install -Dm644 /tmp/cava/include/cava/output/common.h \
            -t /usr/local/include/cava/output/
          sudo mkdir -p /usr/local/lib/pkgconfig
          sudo tee /usr/local/lib/pkgconfig/libcava.pc > /dev/null <<'EOF'
          prefix=/usr/local
          libdir=${prefix}/lib
          includedir=${prefix}/include

          Name: libcava
          Description: Shared library build of cava core (LukashonakV/cava)
          Version: 1.0.0
          Libs: -L${libdir} -lcava -lfftw3 -lm
          Cflags: -I${includedir}
          EOF
          sudo ldconfig
          pkg-config --modversion libcava
      - name: Configure
        # RelWithDebInfo like the AUR/nix packages: the Chromatic perf gate
        # measures optimised code.
        run: cmake -S . -B build -D DISTRIBUTOR="ci" -D CMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Chromatic unit tests (ctest)
        run: ctest --test-dir build --output-on-failure -R chromatic
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Chromatic helper tests (golden, properties, fuzz, perf)
        # Engine tests against the built helper; config's validator at the
        # commit the vendored gate table was copied from.
        env:
          HORNERO_CHROMATIC_BIN: ${{ github.workspace }}/build/lib/hornero-chromatic
          HORNERO_CHROMATIC_CORPUS: ${{ github.workspace }}/build/lib/chromatic-corpus
          HORNERO_CHROMATIC_BENCH: ${{ github.workspace }}/build/lib/chromatic-bench
          HORNERO_CONFIG_DIR: ${{ runner.temp }}/config
          HORNERO_CHROMATIC_SCRATCH: ${{ runner.temp }}/chromatic
          QT_QPA_PLATFORM: offscreen
        run: |
          git clone --quiet --filter=blob:none https://github.com/HorneroOS/config "$HORNERO_CONFIG_DIR"
          git -C "$HORNERO_CONFIG_DIR" checkout --quiet "$(cat libs/chromatic/data/contrast-gates.sha)"
          pip install pytest
          python3 -m pytest -q tests/test_chromatic_*.py

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
      - name: QML/import validation
        run: ./scripts/lint_qml.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest jsonschema==4.26.0 fonttools
      - name: Test suite
        run: python3 -m pytest tests/ -q

  shell-load:
    # Loads the REAL shell.qml with real Quickshell + Qt 6 inside a headless
    # sway, plus every offscreen/qmltestrunner test the ubuntu runners skip
    # (no Quickshell there). Catches QML the engine rejects but qmllint
    # passes, e.g. the illegal `escape` method of #665.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Pinned image; packages come from the Arch Linux Archive snapshot in
      # scripts/ci_arch_shell_deps.sh (quickshell 0.3.2, Qt 6.12).
      image: archlinux@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Restore pacman package + sync database cache
        id: pkgcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /var/cache/pacman/pkg
            /var/lib/pacman/sync
          key: arch-pkgs-${{ hashFiles('scripts/ci_arch_shell_deps.sh') }}
      - name: Install pinned Quickshell + Qt 6 stack
        run: ./scripts/ci_arch_shell_deps.sh
      # Saved right after install so a red test run still warms the cache.
      - name: Save pacman package + sync database cache
        if: steps.pkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /var/cache/pacman/pkg
            /var/lib/pacman/sync
          key: arch-pkgs-${{ hashFiles('scripts/ci_arch_shell_deps.sh') }}
      # Again, now that git is installed: tests use `git ls-files`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build + install the Hornero QML plugin
        run: |
          cmake -S . -B build -G Ninja -D DISTRIBUTOR="ci" \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo -D CMAKE_INSTALL_PREFIX=/usr \
            -D INSTALL_LIBDIR=/usr/lib/hornero -D INSTALL_QMLDIR=/usr/lib/qt6/qml \
            -D INSTALL_QSCONFDIR=/etc/xdg/quickshell/hornero
          cmake --build build
          cmake --install build
      - name: Full shell load + offscreen test suite
        # Unprivileged user: the compositor and shell run as a normal session.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          useradd -m ci
          chown -R ci: .
          mkdir -p shell-load-logs && chown ci: shell-load-logs
          su ci -c "HORNERO_SHELL_LOAD_LOG=$PWD/shell-load-logs/shell.log \
            python3 -m pytest tests/ -q -rs -p no:cacheprovider"
      - name: Upload shell load log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: shell-load-log
          path: shell-load-logs/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh assets/wrap_term_launch.sh
      - name: markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md"
      - name: yaml lint
        run: pip install yamllint && yamllint .
      - name: personal-data guard
        run: ./scripts/check_personal_data.sh
      - name: forbidden-path scan
        run: ./scripts/check_forbidden_paths.sh
