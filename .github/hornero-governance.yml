# Repo policy for the HorneroOS deterministic PR-governance engine.
# Merged over safe defaults; see HorneroOS/.github governance/danger.
#
# NOTE: the shell has no generated colour tables: Hornero Signal roles are
# read from the applied schema-v2 theme at runtime (docs/NATIVE-APPEARANCE.md),
# so no generated_paths pair is declared here.

version: 1
kind: shell
visual_paths:
  - "assets/**"
  - "docs/assets/**"
  - "**/*.qml"
generated_paths: []
policies:
  large_threshold: 800
  forbidden_paths:
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
    - "**/credentials*"
    - "**/*secret*"
  risky_paths:
    - ".github/workflows/**"
    - "plugin/**"
    - "services/**"
    - "config/**"
