name: VM harness

# Deterministic checks for the graphical VM harness (tests/vm). Pull requests
# run lint, unit tests, and a dry-run probe. A manually selected visual matrix
# can boot an ephemeral QEMU guest on a hosted runner and capture Settings.

on:
  pull_request:
    paths:
      - '.github/workflows/vm-harness.yml'
      - 'tests/vm/**'
      - 'docs/VM_TESTING.md'
  workflow_dispatch:
    inputs:
      graphical_matrix:
        description: Boot an ephemeral hosted QEMU guest and capture all Settings panes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  harness-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: shellcheck harness scripts
        run: |
          shellcheck tests/vm/lib/*.sh tests/vm/scenarios/*.sh
          shellcheck -x tests/vm/lib/env.sh tests/vm/lib/*.sh tests/vm/scenarios/*.sh
      - name: Markdown lint for the harness runbook
        run: npx --yes markdownlint-cli2 "docs/VM_TESTING.md"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Harness helper tests
        run: |
          pip install pytest
          python3 -m pytest tests/vm/ -q

  smoke-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Harness coherence probe (no hypervisor)
        run: ./tests/vm/scenarios/vm-smoke.sh --dry-run

  graphical-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.graphical_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VM_MEM: '3072'
      VM_SMP: '2'
      VM_ARTIFACTS_DIR: /tmp/hornero-controlcenter-artifacts
      VM_CACHE_DIR: /tmp/hornero-controlcenter-cache
      VM_SHARED_DIR: /tmp/hornero-controlcenter-shared
      VM_SSH_DIR: /tmp/hornero-controlcenter-ssh
      VM_SSH_KEY: /tmp/hornero-controlcenter-ssh/id_ed25519
      HX_HOREROCTL_BIN: ${{ github.workspace }}/hornero-cli/cli/build/horneroctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Pin the CLI source used by Settings panes that call horneroctl.
      - name: Checkout Hornero CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: HorneroOS/hornero
          ref: 78ff5f4249e84ef18142ca6a6f0a3188657f3144
          path: hornero-cli
          persist-credentials: false
      - name: Stage Hornero's locked V toolchain pins
        run: |
          mkdir -p toolchain
          cp hornero-cli/toolchain/vlang.commit hornero-cli/toolchain/vc.commit \
            hornero-cli/toolchain/tcc.commit hornero-cli/toolchain/tcc-arm64.commit toolchain/
      - name: Install Hornero's pinned V compiler
        uses: ./hornero-cli/.github/actions/setup-v
        env:
          VJOBS: '2'
      - name: Build horneroctl for the graphical guest
        working-directory: hornero-cli/cli
        env:
          VJOBS: '2'
        run: ./make.vsh build-cli && ./build/horneroctl version
      - name: Install ephemeral QEMU guest tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cloud-image-utils curl jq openssh-client python3 qemu-system-x86 qemu-utils
      - name: Capture all Control Center panes
        run: bash tests/vm/scenarios/vm-controlcenter-panels.sh
      - name: Stop the ephemeral guest
        if: always()
        run: |
          pid_file="${VM_CACHE_DIR}/qemu.pid"
          if [[ -f "$pid_file" ]]; then
            qemu_pid="$(cat "$pid_file")"
            if kill -0 "$qemu_pid" 2>/dev/null; then
              kill "$qemu_pid"
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: controlcenter-visual-matrix
          path: /tmp/hornero-controlcenter-artifacts
          if-no-files-found: warn
