name: VM harness

# Deterministic checks for the graphical VM harness (tests/vm). This workflow
# never boots a VM: runners lack KVM and a compositor job would flake, so it
# covers lint, unit tests, and the end-to-end dry-run probe. Real KVM runs stay
# host-side per docs/VM_TESTING.md.

on:
  pull_request:
    paths:
      - '.github/workflows/vm-harness.yml'
      - 'tests/vm/**'
      - 'docs/VM_TESTING.md'
  workflow_dispatch:

jobs:
  harness-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: shellcheck harness scripts
        run: |
          shellcheck tests/vm/lib/*.sh tests/vm/scenarios/*.sh
          shellcheck -x tests/vm/lib/env.sh tests/vm/lib/*.sh tests/vm/scenarios/*.sh
      - name: Markdown lint for the harness runbook
        run: npx --yes markdownlint-cli2 "docs/VM_TESTING.md"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Harness helper tests
        run: |
          pip install pytest
          python3 -m pytest tests/vm/ -q

  smoke-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Harness coherence probe (no hypervisor)
        run: ./tests/vm/scenarios/vm-smoke.sh --dry-run
